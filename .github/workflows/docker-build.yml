name: Docker Build and Push

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix=sha-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          COMMIT_SHA=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test health check endpoint
      run: |
        # Use the locally built image for testing
        LOCAL_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
        echo "Testing with local tag: $LOCAL_TAG"
        
        # Run container with health check test
        echo "Starting container for health check test..."
        CONTAINER_ID=$(docker run -d \
          --publish 8080:8000 \
          --env COMMIT_SHA=${{ github.sha }} \
          --env GITLAB_API_TOKEN=dummy \
          --env WEBHOOK_SECRET=test-secret \
          $LOCAL_TAG)
        
        echo "Container ID: $CONTAINER_ID"
        
        # Wait for container to be ready
        echo "Waiting for container to start..."
        sleep 15
        
        # Check container status
        if ! docker ps --filter "id=$CONTAINER_ID" --format "table {{.Status}}" | grep -q "Up"; then
          echo "❌ Container is not running"
          docker logs $CONTAINER_ID
          docker rm -f $CONTAINER_ID
          exit 1
        fi
        
        # Test health check with retries
        echo "Testing health check endpoint..."
        SUCCESS=false
        for i in {1..10}; do
          if RESPONSE=$(curl -s -f http://localhost:8080/health 2>/dev/null); then
            echo "✅ Health check successful on attempt $i"
            echo "Response: $RESPONSE"
            
            # Verify commit ID is in response
            if echo "$RESPONSE" | grep -q "${{ github.sha }}"; then
              echo "✅ Commit ID verification successful"
              SUCCESS=true
              break
            else
              echo "⚠️  Commit ID not found in response, but health check passed"
              SUCCESS=true
              break
            fi
          else
            echo "⏳ Health check attempt $i failed, retrying in 3 seconds..."
            sleep 3
          fi
        done
        
        # Show container logs for debugging
        echo "Container logs:"
        docker logs $CONTAINER_ID
        
        # Cleanup
        docker rm -f $CONTAINER_ID
        
        if [ "$SUCCESS" = false ]; then
          echo "❌ Health check failed after 10 attempts"
          exit 1
        fi

    - name: Push Docker image
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          COMMIT_SHA=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max 